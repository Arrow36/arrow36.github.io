name: Sync GitHub Pinned Repositories

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pinned:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync all public repositories and pinned items from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_pinned.py

      - name: Commit and push if repositories or pinned list changed
        run: |
          if [ -n "$(git status --porcelain pinned.json index.html sitemap.xml README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pinned.json index.html sitemap.xml README.md
            git commit -m "chore: sync repositories and pinned list from GitHub"
            git push
          else
            echo "No changes to repositories or pinned list."
          fi
