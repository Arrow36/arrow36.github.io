name: Sync GitHub Pinned Repositories

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pinned:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync pinned repositories into pinned.json and index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_pinned.py

      - name: Commit and push if pinned repositories changed
        run: |
          if [ -n "$(git status --porcelain pinned.json index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pinned.json index.html
            git commit -m "chore: sync pinned repositories from GitHub profile"
            git push
          else
            echo "No changes to pinned repositories."
          fi
